name: 部署到 GitHub Pages

# 推送到 main 分支时自动构建并部署，也可以手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 给 GitHub Pages 的部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，新的会取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建项目
        run: npm run build
        env:
          # 若在仓库 Settings → Variables 配置了 API_URL（如 https://chilemei-api.onrender.com），
          # 前端会走真实后端；未配置时保持纯静态演示模式
          VITE_API_BASE: ${{ vars.API_URL }}

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
